# Production-развёртывание AI Teacher for Python
#
# Отличия от dev-конфига:
#   - нет монтирования исходников (образы собираются целиком);
#   - порты БД/Redis не публикуются наружу;
#   - только frontend доступен с хоста, он проксирует /api на backend;
#   - все сервисы с healthcheck и restart: unless-stopped.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_teacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_teacher}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_teacher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ai_teacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_teacher}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      # CORS из ENV, не '*': в prod frontend и API на одном origin (nginx
      # проксирует /api), поэтому CORS нужен только для внешних клиентов.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEBUG: "false"
      # S34-006: Swagger/ReDoc/OpenAPI в production не публикуются.
      DOCS_ENABLED: "false"
      # S34-003: доверяем X-Forwarded-For только reverse-proxy (Caddy/nginx).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
      # Встроенный retention-планировщик (KI-025): раз в сутки удаляет данные
      # старше RETENTION_*_DAYS, внешний cron на хосте больше не обязателен.
      RETENTION_SCHEDULER_ENABLED: "true"
      RETENTION_SCHEDULER_AT: ${RETENTION_SCHEDULER_AT:-03:30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
