# Production-развёртывание AI Teacher for Python (S36).
#
# Образы приложения берутся из GHCR (build на хосте больше не выполняется):
#   BACKEND_IMAGE, FRONTEND_IMAGE, SANDBOX_IMAGE — полные ссылки, включая
#   digest. Их фиксирует scripts/pin_images.sh после публикации тега.
# Если переменные не заданы — используется тег IMAGE_TAG из GHCR.
#
# Запуск (обычно через scripts/deploy.sh):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Caddy — единственный публичный слушатель (80/443 или 8080/8443 на пилоте).
# Frontend/backend доступны только внутри Docker-сети.

# S35-005: ротация логов Docker (JSON, 10 МБ × 3).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# S36-002: приложение из GHCR; digest подставляется через ENV.
x-backend-image: &backend-image ${BACKEND_IMAGE:-ghcr.io/${GHCR_OWNER:-iilmchat}/ai-teacher-backend:${IMAGE_TAG:-v0.6.0}}
x-frontend-image: &frontend-image ${FRONTEND_IMAGE:-ghcr.io/${GHCR_OWNER:-iilmchat}/ai-teacher-frontend:${IMAGE_TAG:-v0.6.0}}
x-sandbox-image: &sandbox-image ${SANDBOX_IMAGE:-ghcr.io/${GHCR_OWNER:-iilmchat}/ai-teacher-sandbox-runner:${IMAGE_TAG:-v0.6.0}}

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    mem_limit: 1g
    cpus: "1.0"
    logging: *default-logging
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_teacher}
      # S38-002: ENV или файл (Docker secrets/K8s). Файл имеет приоритет.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB:-ai_teacher}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_teacher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--appendonly", "yes"]
    mem_limit: 128m
    cpus: "0.5"
    logging: *default-logging
    networks: [internal]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot миграции (S36-004): deploy.sh запускает его до backend.
  # Backend стартует с SKIP_MIGRATIONS=true, чтобы миграции не дублировались.
  migrate:
    image: *backend-image
    profiles: ["tools"]
    mem_limit: 512m
    cpus: "0.5"
    logging: *default-logging
    networks: [internal]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ai_teacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB:-ai_teacher}
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_FILE: ${SECRET_KEY_FILE:-}
      DEBUG: "false"
      SKIP_MIGRATIONS: "true"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: *backend-image
    # S35-001: 2 воркера uvicorn; метрики собираются в multiprocess-режиме.
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "${UVICORN_WORKERS:-2}"
    mem_limit: 2g
    cpus: "2.0"
    logging: *default-logging
    networks: [internal, edge]
    tmpfs:
      - /tmp/prometheus-multiproc:mode=1777
    expose:
      - "8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ai_teacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB:-ai_teacher}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_FILE: ${SECRET_KEY_FILE:-}
      # S36-003: frontend и API на одном origin, CORS нужен только внешним клиентам.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DOMAIN:-localhost}}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_GUARDRAILS_ENABLED: ${LLM_GUARDRAILS_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEBUG: "false"
      DOCS_ENABLED: "false"
      # S34-003/S36-003: X-Forwarded-For принимается только от Docker-сети Caddy.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-10.77.0.0/16}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      METRICS_ENABLED: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_DSN_FILE: ${SENTRY_DSN_FILE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-${IMAGE_TAG:-}}
      # S38-002: SMTP-секрет из файла (если e-mail включат в v0.7.0).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@ai-teacher.local}
      RETENTION_SCHEDULER_ENABLED: "true"
      RETENTION_SCHEDULER_AT: ${RETENTION_SCHEDULER_AT:-03:30}
      # S36-001: образ песочницы из GHCR (container-режим).
      EXECUTOR_MODE: ${EXECUTOR_MODE:-native}
      EXECUTOR_IMAGE: *sandbox-image
      # S36-004: миграции выполняет отдельный job.
      SKIP_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: *frontend-image
    mem_limit: 256m
    cpus: "0.5"
    logging: *default-logging
    networks: [edge]
    expose:
      - "80"
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      APP_RELEASE: ${SENTRY_RELEASE:-${IMAGE_TAG:-}}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    mem_limit: 128m
    cpus: "0.5"
    logging: *default-logging
    networks: [edge]
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  # Публичный edge: Caddy + frontend + backend.
  edge:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.77.0.0/16}
  # Внутренняя сеть без выхода наружу: БД, Redis, backend, миграции.
  internal:
    internal: true
