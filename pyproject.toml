[project]
name = "ai-teacher-python"
version = "0.2.0"
description = "AI Teacher for Python - Interactive learning assistant for schoolchildren"
authors = [
    {name = "RuChating", email = "info@ruchating.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    # FastAPI: Depends() в значениях по умолчанию — штатный паттерн фреймворка
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# pgvector, jose и RestrictedPython не поставляют py.typed-маркеров
module = ["redis.*", "pgvector.*", "jose.*", "RestrictedPython.*", "yaml", "yaml.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Явно задаём scope-loop для async-фикстур, чтобы избежать DeprecationWarning
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "migrations: тесты Alembic на отдельной БД (медленные, запускаются отдельно)",
    "slow: тесты с реальными подпроцессами песочницы (можно отфильтровать)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
