# S38-002: пример передачи секретов через Docker secrets (override).
#
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' "$(openssl rand -base64 48)" > secrets/secret_key
#   printf '%s' 'strong-db-password' > secrets/postgres_password
#   printf '%s' 'sk-...' > secrets/deepseek_api_key
#   chmod 600 secrets/*
#
#   docker compose --env-file .env.prod \
#     -f docker-compose.prod.yml \
#     -f deploy/docker-compose.secrets.example.yml up -d
#
# Файлы секретов не коммитить (secrets/ в .gitignore). Значения `*_FILE` в
# .env.prod должны указывать на пути внутри контейнера (`/run/secrets/...`).

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  migrate:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SECRET_KEY_FILE: /run/secrets/secret_key
    secrets:
      - postgres_password
      - secret_key

  backend:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SECRET_KEY_FILE: /run/secrets/secret_key
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    secrets:
      - postgres_password
      - secret_key
      - deepseek_api_key

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  secret_key:
    file: ./secrets/secret_key
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
