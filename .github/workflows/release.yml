# =============================================================================
# Release (S21-005) — гейты → тег → GitHub Release.
#
# Реальный релиз (ручной запуск, dry_run=false):
#   gh workflow run release.yml -f version=0.3.0 -f dry_run=false
#
# Репетиция (гейты + заметки, без тега и Release):
#   gh workflow run release.yml -f version=0.3.0                 # dry_run=true по умолчанию
#   git tag v0.3.0-dryrun && git push origin v0.3.0-dryrun      # тот же dry-run из тега
#
# Тег с суффиксом `-dryrun` — единственный тег, который запускает workflow:
# так репетиция проверяется на живом runner'е, а «настоящий» тег не порождает
# второй прогон гейтов (рекурсия). Реальный релиз создаётся только из
# workflow_dispatch с dry_run=false.
#
# Гейты — переиспользуемый `ci-selfhosted.yml` (`workflow_call`): те же 6 job'ов,
# что и в PR (lint, test, frontend, security, e2e, docker). GitHub-hosted минуты
# заблокированы биллингом (KI-014), поэтому self-hosted runner.
#
# Заметки релиза — раздел «## Релиз vX.Y.Z» из docs/RELEASES.md
# (`backend/scripts/release_notes.py`), версия сверяется по pyproject.toml,
# frontend/package.json и backend/app/config.py (`backend/scripts/check_version.py`).
# =============================================================================
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса v (например 0.3.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry-run: гейты и заметки без тега и Release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*-dryrun'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Gates (PR CI)
    uses: ./.github/workflows/ci-selfhosted.yml
    secrets: inherit

  release:
    name: Tag & Release
    needs: [gates]
    runs-on: [self-hosted, windows, ai-teacher]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Определить версию и режим
        id: resolve
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = '${{ github.ref }}'
          if ($ref.StartsWith('refs/tags/')) {
            $tag = $ref -replace '^refs/tags/', ''
            $version = ($tag -replace '^v', '') -replace '-dryrun$', ''
            $dryRun = 'true'
            Write-Host "Событие: тег $tag → всегда dry-run (тег создан вручную для репетиции)"
          } else {
            $version = '${{ github.event.inputs.version }}'
            $dryRun = '${{ github.event.inputs.dry_run }}'
            Write-Host "Событие: workflow_dispatch (dry_run=$dryRun)"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Некорректная версия '$version': ожидается X.Y.Z или X.Y.Z-pre"
          }
          Write-Host "Версия: $version, dry-run: $dryRun"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dry_run=$dryRun" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Сверить версию по трём источникам
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.resolve.outputs.version }}'
          # В dry-run расхождение — предупреждение (репетиция допустима для
          # ещё не поднятой версии); в реальном релизе — стоп.
          $strict = '${{ steps.resolve.outputs.dry_run }}' -eq 'false'
          $dockerArgs = @(
            'run', '--rm', '-v', "${env:GITHUB_WORKSPACE}:/src:ro", '-w', '/src',
            'python:3.12-slim',
            'python', 'backend/scripts/check_version.py', '--expected', $version
          )
          if ($strict) { $dockerArgs += '--strict' }
          & docker @dockerArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Версия не согласована: обновите pyproject.toml, frontend/package.json и backend/app/config.py"
          }

      - name: Собрать заметки из docs/RELEASES.md
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE '.release'
          New-Item -ItemType Directory -Force $out | Out-Null
          docker run --rm `
            -v "${env:GITHUB_WORKSPACE}:/src:ro" `
            -v "${out}:/out" `
            -w /src python:3.12-slim `
            python backend/scripts/release_notes.py `
              --version '${{ steps.resolve.outputs.version }}' --output /out/notes.md
          if ($LASTEXITCODE -ne 0) {
            throw "Нет заметок: добавьте раздел «## Релиз v${{ steps.resolve.outputs.version }}» в docs/RELEASES.md"
          }
          Get-Content (Join-Path $out 'notes.md') -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "==> Заметки собраны: $out\notes.md"

      - name: Dry-run — остановиться до тега
        if: ${{ steps.resolve.outputs.dry_run == 'true' }}
        run: |
          Write-Host '==> DRY-RUN: гейты зелёные, заметки собраны; тег и Release НЕ создаются'
          Write-Host "==> Реальный релиз: gh workflow run release.yml -f version=${{ steps.resolve.outputs.version }} -f dry_run=false"

      - name: Тег и GitHub Release
        if: ${{ steps.resolve.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v${{ steps.resolve.outputs.version }}"
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Тег $tag уже существует: версия не переиспользуется, поднимите номер"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $tag -m "Release $tag"
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { throw "git push тега $tag не удался" }
          Write-Host "==> Тег $tag запушен"
          gh release create $tag --title $tag `
            --notes-file (Join-Path $env:GITHUB_WORKSPACE '.release\notes.md') --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create для $tag не удался" }
          Write-Host "==> Release $tag создан"
