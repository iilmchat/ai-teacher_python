# =============================================================================
# Ночной perf-прогон песочницы (S23-003, KI-022).
#
# Бюджет: submit 2 RPS, p95 ≤ 2000 мс (см. backend/scripts/load_test.py).
# PR-гейт — быстрый smoke 0.5 RPS в ci-selfhosted.yml (`Perf smoke (submit)`).
#
# Запускается на self-hosted runner'е: GitHub-hosted минуты заблокированы
# биллингом (KI-014, docs/CI.md). Требования к машине — как у e2e: Docker
# Desktop, compose-кластер Postgres/Redis, venv с зависимостями backend.
# =============================================================================
name: Perf night (submit)

on:
  schedule:
    # 02:00 UTC = 05:00 MSK
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    name: health/tasks/submit
    runs-on: [self-hosted, windows, ai-teacher]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Preflight (runner health)
        run: pwsh -NoProfile -File ./scripts/ci/preflight.ps1
      - name: Портфель сценариев (health 20, tasks 10, submit 5 RPS)
        env:
          E2E_PYTHON: ${{ vars.E2E_PYTHON }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          E2E_POSTGRES_PORT: ${{ vars.E2E_POSTGRES_PORT }}
          E2E_REDIS_PORT: ${{ vars.E2E_REDIS_PORT }}
        run: |
          pwsh -NoProfile -File ./scripts/ci/perf.ps1 `
            -Scenario all -Duration 30 `
            -JsonOut docs/reports/perf/load-test-night.json
      - name: Сравнить с baseline (регресс > 20%)
        if: always()
        env:
          E2E_PYTHON: ${{ vars.E2E_PYTHON }}
        run: |
          if (Test-Path docs/reports/perf/load-test-night.json) {
            & $env:E2E_PYTHON scripts/ci/compare_perf.py `
              --baseline docs/reports/perf/baseline.json `
              --current docs/reports/perf/load-test-night.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning 'нет load-test-night.json — сравнение пропущено'
          }
      - name: Загрузить артефакт perf
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-night
          path: docs/reports/perf/load-test-night.json
          if-no-files-found: ignore
          retention-days: 14
