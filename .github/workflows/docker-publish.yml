# Публикация образов в GHCR (S36-001).
#
# Триггер — только пуш тега `v*` (например v0.6.0). Теги вида `v*-dryrun`
# пропускаются: это репетиции release.yml, образы для них не публикуются.
#
# Образы:
#   ghcr.io/<owner>/ai-teacher-backend:<tag>
#   ghcr.io/<owner>/ai-teacher-frontend:<tag>
#   ghcr.io/<owner>/ai-teacher-sandbox-runner:<tag>
# плюс тег `sha-<short>` для трассируемости. `latest` намеренно не ставится:
# prod-деплой обязан использовать тег/digest (S36-002).
#
# Аутентификация — стандартные `GITHUB_TOKEN` (packages: write) и
# `github.actor`; отдельных PAT не требуется.
name: Publish images (GHCR)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    if: ${{ !contains(github.ref_name, 'dryrun') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: sandbox-runner
            context: ./backend
            dockerfile: ./backend/sandbox_runner/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/ai-teacher-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PIP_INDEX_URL=${{ vars.PIP_INDEX_URL || 'https://pypi.org/simple/' }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      - name: Record digest
        run: |
          mkdir -p .digests
          printf '%s\n' "${{ steps.meta.outputs.tags }}" > ".digests/${{ matrix.name }}.tags"
          printf '%s\n' "${{ steps.build.outputs.digest }}" > ".digests/${{ matrix.name }}.digest"
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ".digests/${{ matrix.name }}.tags" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: .digests/${{ matrix.name }}.*
          if-no-files-found: error
          # .digests — скрытый каталог; без флага upload-artifact его пропускает.
          include-hidden-files: true
          retention-days: 30
