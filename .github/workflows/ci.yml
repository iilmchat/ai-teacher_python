name: CI

# GitHub-hosted job'ы не запускаются с 2026-10-29: биллинг Actions (KI-014) —
# job падает за 2–4 с без шагов с аннотацией «recent account payments have
# failed or your spending limit needs to be increased» (docs/CI.md §1).
# Поэтому workflow переведён в ручной режим и не висит красным на каждом PR:
# PR-гейты даёт .github/workflows/ci-selfhosted.yml (те же команды, тот же
# набор job'ов, self-hosted runner). Вернуть push/pull_request сюда — после
# восстановления биллинга GitHub (KI-014) или при переезде на GitFlic
# (gitflic-ci.yaml уже содержит полный порт).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Причина ручного запуска (для истории)'
        required: false
        type: string

jobs:
  lint:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies (mypy нужны импортируемые пакеты)
        run: |
          python -m pip install --upgrade pip
          # ruff/mypy закреплены в requirements.txt (dev), unpinned ruff ломал lint
          pip install -r backend/requirements.txt

      - name: Run Ruff
        run: |
          cd backend
          ruff check app tests scripts

      # Конфиг mypy лежит в корневом pyproject.toml, поэтому передаём его явно
      - name: Run MyPy (strict)
        run: |
          cd backend
          mypy app --config-file ../pyproject.toml

  monitoring:
    name: Monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: promtool check config/rules
        run: |
          docker run --rm -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/rules/alerts.yml /etc/prometheus/rules/recording.yml

      - name: Validate Grafana dashboards
        run: python scripts/monitoring/validate_dashboards.py

  test:
    name: Test (Backend)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        # pgvector-образ обязателен: миграции создают тип VECTOR (KI-003)
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # В CI сервисы публикуются на канонических портах, поэтому переопределяем
      # локальные порты из .env (KI-001)
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SECRET_KEY: ci_secret_key_do_not_use_in_production

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Check models match migrations
        run: |
          cd backend
          alembic check

      - name: Run tests
        run: |
          cd backend
          pytest -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SECRET_KEY: ci_secret_key_do_not_use_in_production
      LLM_PROVIDER: echo
      RATE_LIMIT_ENABLED: 'false'
      E2E_DB_NAME: ai_teacher_e2e
      E2E_BACKEND_PORT: '8001'
      E2E_FRONTEND_PORT: '3100'
      # В CI backend запускается системным python из venv-пути проекта
      E2E_PYTHON: python

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # pnpm 12 читает настройки из pnpm-workspace.yaml (RULES §11.10)
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Unit tests
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

  # Security-проверки (S20-001/S20-002). Локально не запускаются: PyPI на
  # машине разработки заблокирован, Actions — KI-014. Job существует, чтобы
  # на GitHub Runner'е (PyPI доступен) проверки выполнялись автоматически.
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks сканирует всю историю, а не только последний коммит
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # pip-audit требует PyPI. Локальный fallback для разработки —
      # backend/scripts/audit_python_deps.py (GitHub Advisory API).
      #
      # S22-002/003: starlette 1.10 и pytest 9 закрыли прежние advisory,
      # поэтому --ignore-vuln больше нет — job ловит любые новые находки.
      - name: Audit backend dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict --desc

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          (cd /tmp && grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks-checksums.txt | sha256sum -c -)
          tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks
          gitleaks version

      - name: Scan git history for secrets (gitleaks)
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      # dev-only moderate-находки (vitest toolchain) не блокируют CI,
      # high/critical — блокируют.
      - name: Audit frontend dependencies (pnpm audit)
        working-directory: frontend
        run: pnpm audit --audit-level=high

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Build Backend Image
        run: docker build -t ai-teacher-backend ./backend

      - name: Build Frontend Image
        run: docker build -t ai-teacher-frontend ./frontend
        continue-on-error: true
