# Dependabot: автоматические PR с обновлениями зависимостей (S20-001, S22-004)
#
# Политика (S22-004):
#   - pip-зависимости фиксируются в backend/requirements.txt (RULES §11.3);
#   - npm — pnpm-lock.yaml, обновляется через npm-ecosystem (Dependabot
#     поддерживает pnpm-lock.yaml нативно);
#   - GitHub Actions обновляются отдельно (безопасность supply chain CI);
#   - minor/patch группируются в один PR на экосистему и мержатся после
#     зелёного CI; major приходят отдельными PR и проверяются вручную
#     (конфиги/совместимость);
#   - авто-мерж (label `dependencies` + зелёный CI + minor/patch) на GitHub
#     Free/private недоступен: нет branch protection и auto-merge (KI-023),
#     поэтому мерж — вручную по правилу RULES §10;
#   - после ручного апгрейда (S22-002/003) устаревшие PR закрываются, чтобы
#     Dependabot пересобрал группы от актуальных пинов.
#
# Dependabot не может обновить python-jose: он удалён в S20-001 в пользу
# уже установленного PyJWT (CVE-2024-33663/33664).
version: 2

updates:
  # --- Backend: pip ---------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "build(deps)"
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- Frontend: npm (pnpm-lock.yaml) --------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "build(deps)"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Мажорные обновления vitest/vite/react требуют ручной проверки
    # совместимости конфигов (RULES §11.10) — не группируем.

  # --- GitHub Actions -------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
