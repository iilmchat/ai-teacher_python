server {
    listen 80;
    server_name _;

    # Не раскрываем версию nginx в заголовке Server и на страницах ошибок
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Сжатие статики ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # --- Security headers (S20-002) ---
    # Заголовки задаются на уровне server: nginx наследует их во все location,
    # где нет собственных add_header. Поэтому в location ниже НЕТ add_header —
    # иначе наследование заголовков безопасности отключилось бы.
    #
    # CSP:
    #   script-src 'self' — Vite собирает внешние хэшированные бандлы, inline
    #     скриптов нет (проверено по dist/index.html);
    #   style-src 'unsafe-inline' — React/Tailwind используют style-атрибуты
    #     (тёмная тема, прогресс-бары), а Monaco инжектит inline-стили;
    #   worker-src blob: — Monaco создаёт worker'ов из blob-URL;
    #   img/font data: — иконки/шрифты Monaco и CSS-фоллбеки;
    #   connect-src 'self' — API и WebSocket идут через тот же origin (/api);
    #   frame-ancestors 'none' + X-Frame-Options DENY — запрет embedding.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    # HSTS имеет эффект только по HTTPS (терминация TLS на внешнем proxy);
    # по HTTP браузеры заголовок игнорируют.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SPA: любой неизвестный путь отдаёт index.html (react-router)
    # Внутренние эндпоинты (S25): метрики и health — только для внутренней сети,
    # наружу через nginx не публикуются.
    location = /metrics {
        return 404;
    }

    location /health/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем: после деплоя клиент должен получить новые хэши
    # ассетов (expires -1 даёт Cache-Control: no-cache и не ломает наследование
    # add_header, в отличие от add_header в location).
    location = /index.html {
        expires -1;
    }

    # API проксируется на backend внутри compose-сети
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для чата
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Долгий кэш для хэшированных ассетов.
    # expires вместо add_header Cache-Control — чтобы не потерять security
    # заголовки, унаследованные из server (см. комментарий выше).
    location /assets/ {
        expires 1y;
    }
}
