services:
  postgres:
    # Официальный образ с предустановленным pgvector (нужен для VECTOR-колонок)
    image: pgvector/pgvector:pg17
    container_name: ai_teacher_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_teacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_teacher}
    ports:
      # Внешний порт задаётся через ENV (KI-001): 5432 занят чужим контейнером ticket-postgres
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_teacher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_teacher_redis
    ports:
      # Внешний порт задаётся через ENV (KI-001): 6379 занят чужим контейнером workflow-builder-redis
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_teacher_backend
    environment:
      # Внутри compose-сети используется внутренний порт контейнера (5432)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ai_teacher}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_password}
      - POSTGRES_DB=${POSTGRES_DB:-ai_teacher}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Внутри compose-сети Redis доступен на внутреннем порту 6379
      - SECRET_KEY=${SECRET_KEY:-change_me_secret_key}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://localhost:1234/v1}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-local-model}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SEED_ON_START=${SEED_ON_START:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_teacher_frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
